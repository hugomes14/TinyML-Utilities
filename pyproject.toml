[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyml-utilities"
version = "0.2.0"
description = "Captura de video de uma smartcamera LIMA e extracao de frames."
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{name = "Hugo Gomes"}]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "Pillow>=11",
    "PyQt5>=5.15",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["smartcamera*"]
